<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SABI - AI Homework Helper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .app {
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      padding: 22px 18px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 6px 0 0;
      color: #666;
    }

    .chat {
      flex: 1;
      padding: 20px;
    }

    .welcome {
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      margin-top: 0;
    }

    .input-area {
      background: white;
      padding: 15px;
      border-top: 1px solid #ddd;
    }

    textarea {
      width: 100%;
      min-height: 70px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 12px;
      resize: none;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button,
    label {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      text-align: center;
      font-size: 15px;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    #answer {
      margin-top: 15px;
      padding: 15px;
      background: #eef1f7;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>🤖 SABI</h1>
      <p>AI Homework Helper</p>
    </header>

    <main class="chat">

      <div class="welcome">
        <h2>Welcome to SABI!</h2>
        <p>Ask your homework question below.</p>
        <p>You can also upload a photo of your question.</p>
      </div>

      <div id="answer"></div>

    </main>

    <div class="input-area">

      <textarea id="question"
        placeholder="Type your homework question here..."></textarea>

      <div class="buttons">

        <label>
          📷 Upload Photo
          <input type="file" id="photo" accept="image/*">
        </label>

        <button onclick="askSabi()">Ask SABI</button>

      </div>

    </div>

  </div>

  <script>
    function askSabi() {
      const question = document.getElementById("question").value.trim();
      const answer = document.getElementById("answer");

      if (!question) {
        answer.style.display = "block";
        answer.innerHTML = "Please type your homework question first.";
        return;
      }

      answer.style.display = "block";
      answer.innerHTML =
        "<strong>SABI:</strong><br><br>" +
        "Your question was received! AI answering will be connected next.";
    }
  </script>

</body>
</html>
