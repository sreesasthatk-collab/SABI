<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SABI - AI Homework Helper</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      min-height: 100vh;
      color: #172033;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: auto;
      padding: 25px 0 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      color: #4f46e5;
    }

    .badge {
      background: white;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #64748b;
      font-size: 16px;
      line-height: 1.6;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .subject {
      border: none;
      background: white;
      padding: 17px 10px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
      transition: 0.2s;
    }

    .subject:hover {
      transform: translateY(-2px);
    }

    .chat-box {
      background: white;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    #answer {
      min-height: 120px;
      padding: 18px;
      background: #f8fafc;
      border-radius: 16px;
      margin-bottom: 18px;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #334155;
    }

    .input-area {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #question {
      flex: 1;
      border: 1px solid #dbe2ea;
      border-radius: 15px;
      padding: 15px;
      font-size: 15px;
      outline: none;
    }

    #question:focus {
      border-color: #6366f1;
    }

    .send-btn {
      border: none;
      background: #4f46e5;
      color: white;
      padding: 15px 20px;
      border-radius: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .upload-label {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 16px;
      background: #eef2ff;
      color: #4338ca;
      border-radius: 13px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    #fileInput {
      display: none;
    }

    #fileName {
      margin-top: 8px;
      font-size: 13px;
      color: #64748b;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #94a3b8;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 30px;
      }

      .subjects {
        grid-template-columns: repeat(2, 1fr);
      }

      .input-area {
        flex-direction: column;
      }

      #question,
      .send-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">SABI</div>
      <div class="badge">AI Homework Helper</div>
    </header>

    <section class="hero">
      <h1>Welcome to SABI 👋</h1>
      <p>
        Ask questions, understand your homework,<br>
        and learn step by step with SABI.
      </p>
    </section>

    <div class="subjects">
      <button class="subject" onclick="setSubject('Math')">📐 Math</button>
      <button class="subject" onclick="setSubject('Science')">🔬 Science</button>
      <button class="subject" onclick="setSubject('English')">📚 English</button>
      <button class="subject" onclick="setSubject('History')">🌍 History</button>
    </div>

    <div class="chat-box">

      <div id="answer">
        👋 Hi! I'm SABI. Ask me a homework question and I'll help you.
      </div>

      <div class="input-area">
        <input
          id="question"
          type="text"
          placeholder="Ask SABI anything..."
          onkeydown="handleEnter(event)"
        >

        <button class="send-btn" id="sendBtn" onclick="askSabi()">
          Send
        </button>
      </div>

      <label class="upload-label" for="fileInput">
        📷 Upload Homework Photo
      </label>

      <input
        id="fileInput"
        type="file"
        accept="image/*"
        onchange="showFile()"
      >

      <div id="fileName"></div>

    </div>

    <footer>
      SABI • Learn smarter, one question at a time.
    </footer>

  </div>

  <script>

    let selectedSubject = "";

    function setSubject(subject) {
      selectedSubject = subject;

      const questionBox = document.getElementById("question");

      questionBox.value = "";
      questionBox.placeholder =
        "Ask your " + subject + " question...";

      questionBox.focus();
    }

    function showFile() {
      const fileInput = document.getElementById("fileInput");
      const fileName = document.getElementById("fileName");

      if (fileInput.files.length > 0) {
        fileName.textContent =
          "📎 Selected: " + fileInput.files[0].name;
      }
    }

    function handleEnter(event) {
      if (event.key === "Enter") {
        askSabi();
      }
    }

    async function askSabi() {

      const questionBox = document.getElementById("question");
      const answerBox = document.getElementById("answer");
      const sendBtn = document.getElementById("sendBtn");

      const question = questionBox.value.trim();

      if (!question) {
        answerBox.textContent =
          "Please type a question first.";
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "Thinking...";

      answerBox.textContent =
        "🤔 SABI is thinking...";

      try {

        const finalQuestion = selectedSubject
          ? "Subject: " + selectedSubject + "\n\n" + question
          : question;

        const response = await fetch("/api/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question: finalQuestion
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        answerBox.textContent =
          data.answer || "Sorry, I couldn't generate an answer.";

      } catch (error) {

        answerBox.textContent =
          "Sorry 😔 Something went wrong. Please try again.";

      } finally {

        sendBtn.disabled = false;
        sendBtn.textContent = "Send";

      }
    }

  </script>

</body>
</html>
