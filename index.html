<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>SABI - AI Homework Helper</title>  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f8fc;
      --card: rgba(255,255,255,0.88);
      --text: #171827;
      --muted: #777b8c;
      --border: #e9eaf1;
      --primary: #6c5ce7;
      --primary2: #8b5cf6;
      --dark: #181828;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #eee9ff 0, transparent 32%),
        radial-gradient(circle at top right, #e8f1ff 0, transparent 28%),
        var(--bg);
      color: var(--text);
    }

    .app {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      padding: 18px 18px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(18px);
      background: rgba(247,248,252,0.78);
      border-bottom: 1px solid rgba(220,220,230,0.55);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      box-shadow: 0 8px 22px rgba(108,92,231,0.28);
    }

    .brand h1 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -0.5px;
    }

    .brand span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .pro-badge {
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #5c48d7;
      background: #eeeaff;
    }

    /* CHAT */

    .chat {
      flex: 1;
      padding: 30px 18px 145px;
    }

    .hero {
      text-align: center;
      padding: 32px 12px 25px;
    }

    .hero-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      background: white;
      box-shadow: 0 14px 40px rgba(40,35,80,0.10);
    }

    .hero h2 {
      margin: 0;
      font-size: 29px;
      letter-spacing: -1px;
    }

    .hero p {
      margin: 9px auto 0;
      max-width: 450px;
      line-height: 1.55;
      color: var(--muted);
      font-size: 14px;
    }

    /* QUICK SUBJECTS */

    .section-title {
      margin: 12px 2px 12px;
      font-size: 12px;
      font-weight: 700;
      color: #8b8e9c;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .subject {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 16px;
      padding: 14px 5px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s ease;
      font-size: 12px;
      color: #3e4050;
    }

    .subject:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30,30,70,0.08);
    }

    .subject-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 6px;
    }

    /* ANSWER */

    #answer {
      margin-top: 22px;
      padding: 18px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      line-height: 1.65;
      box-shadow: 0 10px 30px rgba(30,30,70,0.06);
      display: none;
    }

    .answer-title {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    /* INPUT */

    .input-wrapper {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      width: min(724px, calc(100% - 24px));
      z-index: 20;
    }

    .input-area {
      padding: 11px;
      border: 1px solid rgba(220,220,230,0.9);
      border-radius: 23px;
      background: rgba(255,255,255,0.91);
      backdrop-filter: blur(22px);
      box-shadow: 0 16px 45px rgba(30,30,60,0.13);
    }

    .textarea-wrap {
      position: relative;
    }

    textarea {
      width: 100%;
      min-height: 54px;
      max-height: 130px;
      padding: 15px 14px;
      padding-right: 50px;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
    }

    textarea::placeholder {
      color: #a0a3b0;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tools {
      display: flex;
      gap: 7px;
    }

    .tool-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fafaff;
      cursor: pointer;
      font-size: 17px;
    }

    .send-btn {
      width: 45px;
      height: 45px;
      padding: 0;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: white;
      font-size: 19px;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(108,92,231,0.27);
    }

    input[type="file"] {
      display: none;
    }

    .file-name {
      margin-top: 5px;
      padding-left: 6px;
      font-size: 11px;
      color: var(--primary);
      display: none;
    }

    .hint {
      text-align: center;
      margin-top: 7px;
      color: #a1a3af;
      font-size: 10px;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      header {
        padding: 15px 14px 12px;
      }

      .chat {
        padding: 22px 14px 150px;
      }

      .hero {
        padding-top: 25px;
      }

      .hero h2 {
        font-size: 25px;
      }

      .subjects {
        grid-template-columns: repeat(2, 1fr);
      }

      .input-wrapper {
        width: calc(100% - 16px);
        bottom: 8px;
      }

      .pro-badge {
        display: none;
      }
    }
  </style></head><body><div class="app">  <header>
    <div class="brand">
      <div class="logo">✦</div>
      <div>
        <h1>SABI</h1>
        <span>AI Homework Helper</span>
      </div>
    </div><div class="pro-badge">1 MONTH FREE</div>

  </header>  <main class="chat"><section class="hero">

  <div class="hero-icon">🤖</div>

  <h2>What can I help you learn?</h2>

  <p>
    Ask a question, upload your homework,
    and let SABI help you understand it step by step.
  </p>

</section>


<div class="section-title">Choose a subject</div>

<div class="subjects">

  <div class="subject" onclick="chooseSubject('Math')">
    <span class="subject-icon">📐</span>
    Math
  </div>

  <div class="subject" onclick="chooseSubject('Science')">
    <span class="subject-icon">🔬</span>
    Science
  </div>

  <div class="subject" onclick="chooseSubject('English')">
    <span class="subject-icon">📖</span>
    English
  </div>

  <div class="subject" onclick="chooseSubject('History')">
    <span class="subject-icon">🌎</span>
    History
  </div>

</div>


<div id="answer"></div>

  </main>  <div class="input-wrapper"><div class="input-area">

  <div class="textarea-wrap">

    <textarea
      id="question"
      placeholder="Ask SABI anything about your homework..."
    ></textarea>

  </div>


  <div class="bottom-row">

    <div class="tools">

      <label class="tool-btn" title="Upload homework photo">
        📎
        <input
          type="file"
          id="photo"
          accept="image/*"
          onchange="showFile()"
        >
      </label>

      <button class="tool-btn" type="button" onclick="clearQuestion()">
        ↺
      </button>

    </div>


    <button class="send-btn" onclick="askSabi()">
      ↑
    </button>

  </div>

  <div id="fileName" class="file-name"></div>

</div>

<div class="hint">
  SABI can help explain homework questions step by step.
</div>

  </div></div><script>

  function chooseSubject(subject) {

    const question = document.getElementById("question");

    question.value =
      "I need help with " + subject + ". ";

    question.focus();
  }


  function showFile() {

    const fileInput = document.getElementById("photo");
    const fileName = document.getElementById("fileName");

    if (fileInput.files.length > 0) {

      fileName.style.display = "block";

      fileName.innerHTML =
        "📎 " + fileInput.files[0].name;

    }
  }


  function clearQuestion() {

    document.getElementById("question").value = "";

    document.getElementById("fileName").style.display = "none";

    document.getElementById("answer").style.display = "none";
  }


  function askSabi() {

    const question =
      document.getElementById("question").value.trim();

    const answer =
      document.getElementById("answer");

    if (!question) {

      answer.style.display = "block";

      answer.innerHTML =
        "<div class='answer-title'>SABI</div>" +
        "Please type your homework question first.";

      return;
    }


    answer.style.display = "block";

    answer.innerHTML =
      "<div class='answer-title'>✦ SABI</div>" +
      "I received your question!<br><br>" +
      "The AI answer system will be connected next. " +
      "Soon SABI will be able to explain your homework step by step.";

    answer.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }

</script></body>
</html>
