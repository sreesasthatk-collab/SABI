<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SABI - AI Homework Helper</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: white;
      padding: 18px 20px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      color: #5b4bdb;
    }

    header p {
      margin: 6px 0 0;
      color: #666;
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 35px auto;
    }

    .welcome {
      background: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .welcome h2 {
      margin-top: 0;
      color: #333;
    }

    .welcome p {
      color: #666;
      line-height: 1.5;
    }

    .subjects {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px 0;
    }

    .subject {
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      background: #eeeaff;
      color: #5141c9;
      cursor: pointer;
      font-size: 14px;
    }

    .subject:hover {
      background: #ddd7ff;
    }

    .chat-box {
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    #answerBox {
      min-height: 80px;
      padding: 15px;
      background: #f8f8ff;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.6;
      color: #333;
      margin-bottom: 15px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    #questionInput {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    #sendButton {
      border: none;
      background: #5b4bdb;
      color: white;
      padding: 0 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
    }

    #sendButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        margin: 20px auto;
      }

      .input-row {
        flex-direction: column;
      }

      #sendButton {
        height: 48px;
      }

      #questionInput {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>SABI</h1>
    <p>Your AI Homework Helper & Study Buddy</p>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>Hi! I'm SABI 😊</h2>

      <p>
        I'm here to help you with homework, questions and studying.
        Ask me anything and we'll figure it out together!
      </p>

      <div class="subjects">
        <button class="subject" data-subject="Math">📐 Math</button>
        <button class="subject" data-subject="Science">🔬 Science</button>
        <button class="subject" data-subject="English">📚 English</button>
        <button class="subject" data-subject="History">🌍 History</button>
      </div>
    </section>

    <section class="chat-box">

      <div id="answerBox">
        Hi! 😊 What would you like help with today?
      </div>

      <div class="input-row">

        <input
          type="text"
          id="questionInput"
          placeholder="Ask SABI a question..."
          autocomplete="off"
        >

        <button id="sendButton">
          Send
        </button>

      </div>

    </section>

  </main>

  <footer>
    SABI • Learn comfortably, one question at a time 💜
  </footer>


  <script>

    let selectedSubject = "";
    let isAsking = false;

    const questionInput =
      document.getElementById("questionInput");

    const sendButton =
      document.getElementById("sendButton");

    const answerBox =
      document.getElementById("answerBox");


    /*
      SUBJECT BUTTONS
    */

    document.querySelectorAll(".subject").forEach(button => {

      button.addEventListener("click", () => {

        selectedSubject =
          button.dataset.subject;

        questionInput.value = "";

        questionInput.placeholder =
          selectedSubject + " question...";

        questionInput.focus();

        answerBox.textContent =
          "Sure! 😊 Ask me your " +
          selectedSubject +
          " question.";

      });

    });


    /*
      SEND BUTTON
    */

    sendButton.addEventListener("click", () => {

      if (!isAsking) {
        askSabi();
      }

    });


    /*
      ENTER KEY
    */

    questionInput.addEventListener("keydown", event => {

      if (event.key === "Enter") {

        event.preventDefault();

        if (!isAsking) {
          askSabi();
        }

      }

    });


    /*
      MAIN SABI FUNCTION
    */

    async function askSabi() {

      const question =
        questionInput.value.trim();


      if (!question || isAsking) {

        if (!question) {

          answerBox.textContent =
            "Please type a question.";

        }

        return;
      }


      isAsking = true;

      sendButton.disabled = true;

      sendButton.textContent =
        "Thinking...";


      answerBox.textContent =
        "Let me think 😊";


      /*
        Build the text question
      */

      let finalQuestion = question;


      if (selectedSubject) {

        finalQuestion =
          "Subject: " +
          selectedSubject +
          "\n\nStudent question: " +
          question;

      }


      /*
        Send text question only
      */

      try {

        const response =
          await fetch("/api/ask", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              question: finalQuestion

            })

          });


        const data =
          await response.json();


        if (data.answer) {

          answerBox.textContent =
            data.answer;

        } else if (data.error) {

          answerBox.textContent =
            data.error;

        } else {

          answerBox.textContent =
            "Sorry, I couldn't answer that. Please try again 😊";

        }


      } catch (error) {

        console.error(
          "SABI request error:",
          error
        );

        answerBox.textContent =
          "Sorry, something went wrong. Please try again 😊";

      }


      isAsking = false;

      sendButton.disabled = false;

      sendButton.textContent =
        "Send";

    }

  </script>

</body>
</html>
